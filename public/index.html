<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do App</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <section id="loginView" class="card">
        <h1>Welcome to To-Do</h1>
        <p>Sign in or create an account with Amazon Cognito to manage your tasks.</p>
        <a class="button" href="/oauth2/authorization/cognito">Sign In / Create Account</a>
        <p id="loginError" class="error-message" role="status"></p>
      </section>

      <section id="todoView" class="card hidden">
        <header class="todo-header">
          <div>
            <h1>To-Do List</h1>
            <p id="welcomeMessage" class="muted"></p>
          </div>
          <form action="/logout" method="post">
            <input id="logoutCsrfToken" type="hidden" name="_csrf" value="" />
            <button type="submit" class="secondary">Log Out</button>
          </form>
        </header>

        <form id="todoForm" class="todo-form">
          <input type="text" id="todoInput" placeholder="Add a new task" required />
          <button type="submit">Add</button>
        </form>

        <ul id="todoList" class="todo-list"></ul>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
